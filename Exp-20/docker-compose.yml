version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: exp20-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
    volumes:
      - ./Backend:/app
    command: python run.py
    networks:
      - exp20-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: exp20-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - exp20-network

networks:
  exp20-network:
    driver: bridge
